<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">

<title>SOLMAR HEAT — Open-World Crime di Kota Solmar</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0e14; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }

</style>
</head>

<canvas id="game" aria-label="Solmar Heat: open-world crime game — jalan kaki atau nyetir di kota Solmar, curi mobil, kabur dari polisi, selesaikan misi Mara Voss"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
